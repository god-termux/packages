name: Build components

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Компонент из components/*.env (пусто: все)"
        default: ""
  push:
    branches: [main]
    paths:
      - "components/**"
      - "scripts/**"
      - "packaging/**"
      - ".github/workflows/build.yml"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          if [ -n "${{ inputs.component }}" ]; then list="${{ inputs.component }}"; else list=$(cd components && ls *.env | sed 's/\.env$//'); fi
          echo "matrix=$(echo $list | tr ' ' '\n' | jq -R . | jq -sc '{component: .}')" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    # Debian 13: те же версии библиотек, что в дереве dapt на телефоне
    container: debian:trixie
    env:
      COMPONENT: ${{ matrix.component }}
    steps:
      - name: Git for checkout
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Cache cargo and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            work/${{ env.COMPONENT }}-src/target
          key: cargo-${{ env.COMPONENT }}-${{ hashFiles(format('components/{0}.env', env.COMPONENT)) }}
          restore-keys: cargo-${{ env.COMPONENT }}-

      - name: Build ${{ env.COMPONENT }}
        run: bash scripts/build-component.sh "$COMPONENT"

      - name: Package (.deb)
        run: |
          apt-get install -y --no-install-recommends dpkg-dev xz-utils
          bash scripts/make-deb.sh "$COMPONENT"

      - name: Summary
        run: |
          {
            echo "### $COMPONENT"
            echo '```'
            cat "dist/$COMPONENT/SOURCE.txt"
            echo "glibc max: $(cat dist/$COMPONENT/glibc-max.txt)"
            echo "NEEDED:"; cat "dist/$COMPONENT/NEEDED.txt"
            echo "Debian packages (dapt install):"; cat "dist/$COMPONENT/runtime-packages.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ env.COMPONENT }}
          path: dist/deb

  # подписанный apt-репозиторий на GitHub Pages: dapt install god-cosmic ...
  # (сборка страницы и деплой в разных задачах: иначе deploy-pages не видит только что загруженный артефакт)
  repo:
    needs: build
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.component == '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist/deb
      - name: Build apt repository
        env:
          GPG_KEY_B64: ${{ secrets.GOD_COSMIC_GPG_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils gnupg
          bash scripts/make-repo.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: repo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
